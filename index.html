<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <form action="#" id="detials">
       <div id="email-label">
        Email
       </div>
        <input type="text" placeholder="Example@email.com" id="E-Mail">
       <div id="email-error">error</div>
        <div id="password-label">
        Password
       </div>
        <input type="password" placeholder="Your Password" id="Password-Id">
        <div id="password-error">error</div>
        <div id="allgood"></div>
       <div class="submit">
        <input type="submit" value="Submit" id="Submit-btn">
       </div>
        
    </form>
</div>
</body>
<script src="script.js"></script>
</html>
